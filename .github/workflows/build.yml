name: build

# Reusable pipeline: builds FFmpegKit.Net's two packages (the cross-platform client and the MAUI
# package) at a given version, for all eight variants, validates the packed packages, and uploads
# them as an artifact. Callers (pr.yml, release.yml) decide the version and what to do with the
# result.
#
# This repository does not build the Android or iOS bindings - both packages depend on them as
# ordinary NuGet packages already published to nuget.org from sbokatuk/FFmpegKit.Android and
# sbokatuk/FFmpegKit.iOS, pinned to an exact version in Directory.Build.props. Everything here
# packs on macos-latest: both packages multi-target Android and iOS together, so restoring either
# needs the iOS workload regardless of which platform's code is being exercised.

on:
  workflow_call:
    inputs:
      version:
        description: NuGet version to stamp on every package.
        required: true
        type: string
      android-package-version:
        description: >
          FFmpegKit.Net.<Variant>.Android version to depend on. Defaults to
          FFmpegKitAndroidPackageVersion in Directory.Build.props.
        required: false
        default: ''
        type: string
      ios-package-version:
        description: >
          FFmpegKit.Net.<Variant>.iOS version to depend on. Defaults to FFmpegKitIosPackageVersion
          in Directory.Build.props.
        required: false
        default: ''
        type: string

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  pack:
    name: pack
    runs-on: macos-latest
    outputs:
      android-package-version: ${{ steps.pins.outputs.android }}
      ios-package-version: ${{ steps.pins.outputs.ios }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install iOS/Android/MAUI workloads for every SDK band
        run: |
          for major in 9 10; do
            dir="${RUNNER_TEMP}/sdk${major}"
            mkdir -p "${dir}"
            sdk=$(dotnet --list-sdks | grep "^${major}\." | tail -1 | cut -d' ' -f1)
            ( cd "${dir}" \
              && dotnet new globaljson --sdk-version "${sdk}" --force \
              && dotnet workload install android ios maui-ios )
          done

      - name: Resolve external binding pins
        id: pins
        run: |
          android="${{ inputs.android-package-version }}"
          if [ -z "${android}" ]; then
            android=$(grep -oPm1 '(?<=<FFmpegKitAndroidPackageVersion>)[^<]+' Directory.Build.props)
          fi
          ios="${{ inputs.ios-package-version }}"
          if [ -z "${ios}" ]; then
            ios=$(grep -oPm1 '(?<=<FFmpegKitIosPackageVersion>)[^<]+' Directory.Build.props)
          fi
          if [ -z "${android}" ] || [ -z "${ios}" ]; then
            echo "::error::could not determine the Android/iOS binding pins"
            exit 1
          fi
          echo "android=${android}" >> "$GITHUB_OUTPUT"
          echo "ios=${ios}" >> "$GITHUB_OUTPUT"
          echo "Depending on FFmpegKit.Net.*.Android ${android}, FFmpegKit.Net.*.iOS ${ios}" >> "$GITHUB_STEP_SUMMARY"

      - name: Pack the cross-platform client and MAUI package, all variants
        run: ./build/BuildNugets.sh "${{ inputs.version }}" "${{ steps.pins.outputs.android }}" "${{ steps.pins.outputs.ios }}"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 7

  validate:
    name: validate packages
    needs: pack
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install Android/iOS/MAUI workloads
        run: dotnet workload install android ios maui

      - name: Run package tests
        run: dotnet test tests/FFmpegKit.Net.PackageTests --logger 'trx;LogFileName=package-tests.trx'

      # The sample consumes FFmpegKit.Net.Full.Maui through a PackageReference exactly as a user
      # would, so it is what catches an API that no longer matches what the README documents -
      # nothing else here builds against the packed packages the way an actual consumer does.
      # Build only, both target frameworks: proving it links is the point, not running it.
      - name: Build the sample against the packed packages
        run: |
          dotnet build samples/FFmpegKit.Net.Sample/FFmpegKit.Net.Sample.csproj \
            --configuration Release \
            -p:FFmpegKitVersion="${{ inputs.version }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-test-results
          path: '**/*.trx'
          if-no-files-found: ignore
          retention-days: 7
